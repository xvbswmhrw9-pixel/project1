<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Wedding — Jasmine & Bayu</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

  <!-- ===================== Landing Page ===================== -->
  <div id="landing" class="page visible">
    <div class="landing-inner">
      <h1 class="title">Mulki & Sarah</h1>
      <p class="subtitle">We joyfully invite you to our wedding</p>

      <div class="guest-name" id="guestName">
        <!-- Dynamic guest name from URL -->
      </div>

      <button id="openBtn" class="open-btn">Open Invitation</button>
    </div>
  </div>

<!-- HERO / BRIDE SECTION -->
<main id="content">
<section id="bride" class="page">
<div class="container">
<div class="polaroid reveal-right">
<img src="/mnt/data/63e08150-c380-4f25-a5e4-7a4878532c49.png" alt="Bride">
</div>

<div class="text reveal-right">
<div class="intro">We invite you to join our wedding</div>
<h1 class="name">FAUZIAH<br>JASMINE</h1>
<p class="parents">Putri Pertama dari<br>Bapak (Alm) Yoyo Sucahyo &amp; Ibu Lina Raeny</p>
</div>
</div>
</section>

<!-- GROOM SECTION -->
<section id="groom" class="page">
<div class="container reverse">
<div class="polaroid reveal-left">
<img src="/mnt/data/63e08150-c380-4f25-a5e4-7a4878532c49.png" alt="Groom">
</div>

<div class="text reveal-left">
<h1 class="name">BAYU TRI<br>ASTANTO</h1>
<p class="parents">Putra Ketiga dari<br>Bapak (Alm) H. Mulyadi &amp; Ibu Nonoy Suryati</p>
</div>
</div>
</section>

</main>

</body>
</html>
